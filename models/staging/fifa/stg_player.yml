version: 2
models:
- name: stg_player
  description: This model processes player data from the FIFA source, standardizing
    and renaming fields for consistency and ease of use. It calculates the player's
    age as of June 14, 2018, and combines first and last names into a full player
    name.
  columns:
  - name: player_id
    description: A unique identifier for each player.
  - name: player_name
    description: The full name of the player, combining first and last names.
    data_tests:
      - not_null
  - name: player_first_name
    description: The first name of the player.
  - name: player_middle_name
    description: The middle name of the player, if available.
  - name: player_last_name
    description: The last name of the player.
  - name: player_known_name
    description: An alternative name the player is known by, if applicable.
  - name: age
    description: The age of the player as of June 14, 2018.
    data_tests:
      - not_null
  - name: birth_date
    description: The birth date of the player.
  - name: weight
    description: The weight of the player.
  - name: height
    description: The height of the player.
  - name: city
    description: The city where the player is from.
  - name: national_team_affiliation_id
    description: The identifier for the player's national team affiliation.
  - name: affiliation_id
    description: The identifier for the player's club or other affiliation.
